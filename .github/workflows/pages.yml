name: GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  workflow_run:
    workflows:
      - showcase-media
    types:
      - completed
    branches:
      - master

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build project site and game
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v6.0.0
        with:
          node-version: 24.20.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 11.25.0

      - name: Restore frozen classic lockfile
        shell: bash
        run: git show 992d54c2b97d3449bf5a6d2fc0912ba96484c829:package-lock.json > package-lock.json

      - name: Install classic MVP dependencies
        run: npm ci --legacy-peer-deps

      - name: Build classic MVP
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run build

      - name: Stage classic MVP
        shell: bash
        run: |
          rm -rf /tmp/defend-classic
          mv dist /tmp/defend-classic

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy

      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa
        with:
          version: v0.15.0

      - name: Install modern workspace
        working-directory: experiments
        run: pnpm install --frozen-lockfile

      - name: Build GitHub Pages site
        working-directory: experiments
        run: |
          pnpm --filter @defend/hybrid-engine-lab wasm
          pnpm --filter @defend/hybrid-engine-lab exec tsc --noEmit
          pnpm --filter @defend/hybrid-engine-lab exec vite build --base=/defend/

      - name: Add classic MVP to Pages artifact
        shell: bash
        run: |
          mkdir -p experiments/hybrid-engine/dist/classic
          cp -R /tmp/defend-classic/. experiments/hybrid-engine/dist/classic/

      - name: Verify Pages artifact
        shell: bash
        run: |
          test -f experiments/hybrid-engine/dist/index.html
          test -f experiments/hybrid-engine/dist/classic/index.html
          test -f experiments/hybrid-engine/dist/arena.html
          test -f experiments/hybrid-engine/dist/mothership.html
          test -f experiments/hybrid-engine/dist/navigation.html
          test -f experiments/hybrid-engine/dist/geothermal.html
          test -f experiments/hybrid-engine/dist/routing.html
          test -f experiments/hybrid-engine/dist/tower-terrain.html
          test -f experiments/hybrid-engine/dist/favicon.svg
          grep -q '/defend/assets/' experiments/hybrid-engine/dist/index.html
          grep -q 'Defend — physics-driven strategy' experiments/hybrid-engine/dist/index.html
          grep -q 'Play Defend — classic MVP' experiments/hybrid-engine/dist/index.html
          grep -q 'renderCanvas' experiments/hybrid-engine/dist/classic/index.html
          grep -q 'Defend — Deterministic Arena' experiments/hybrid-engine/dist/arena.html
          grep -q 'Game manual' experiments/hybrid-engine/dist/index.html

      - name: Preserve published showcase media
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          rm -rf /tmp/defend-published-showcase
          mkdir -p /tmp/defend-published-showcase
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git archive origin/gh-pages showcase 2>/dev/null | tar -x -C /tmp/defend-published-showcase || true
          fi
          if [ -d /tmp/defend-published-showcase/showcase ]; then
            cp -R /tmp/defend-published-showcase/showcase experiments/hybrid-engine/dist/showcase
          fi
          touch experiments/hybrid-engine/dist/.nojekyll

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: experiments/hybrid-engine/dist

  deploy:
    name: Deploy landing site and game
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
