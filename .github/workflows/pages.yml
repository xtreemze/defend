name: GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build modern preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v6.0.0
        with:
          node-version: 24.20.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 11.25.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy

      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa
        with:
          version: v0.15.0

      - name: Install modern workspace
        working-directory: experiments
        run: pnpm install --frozen-lockfile

      - name: Build modern Pages preview
        working-directory: experiments
        run: |
          pnpm --filter @defend/hybrid-engine-lab wasm
          pnpm --filter @defend/hybrid-engine-lab exec tsc --noEmit
          pnpm --filter @defend/hybrid-engine-lab exec vite build --base=/defend/

      - name: Verify Pages artifact
        shell: bash
        run: |
          test -f experiments/hybrid-engine/dist/index.html
          test -f experiments/hybrid-engine/dist/mothership.html
          test -f experiments/hybrid-engine/dist/navigation.html
          test -f experiments/hybrid-engine/dist/geothermal.html
          test -f experiments/hybrid-engine/dist/routing.html
          test -f experiments/hybrid-engine/dist/tower-terrain.html
          test -f experiments/hybrid-engine/dist/favicon.svg
          grep -q '/defend/assets/' experiments/hybrid-engine/dist/index.html
          grep -q 'Defend — Deterministic Arena' experiments/hybrid-engine/dist/index.html

      - name: Publish verified preview to gh-pages
        if: github.event_name != 'pull_request'
        working-directory: experiments/hybrid-engine/dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          touch .nojekyll
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Deploy modern preview from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
