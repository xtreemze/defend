name: hybrid-browser-smoke

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/hybrid-browser-smoke.yml'
      - 'experiments/pnpm-lock.yaml'
      - 'experiments/pnpm-workspace.yaml'
      - 'experiments/package.json'
      - 'experiments/hybrid-engine/**'
      - 'rust-toolchain.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - '.github/workflows/hybrid-browser-smoke.yml'
      - 'experiments/pnpm-lock.yaml'
      - 'experiments/pnpm-workspace.yaml'
      - 'experiments/package.json'
      - 'experiments/hybrid-engine/**'
      - 'rust-toolchain.toml'
      - 'Cargo.lock'

permissions:
  contents: read

jobs:
  smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: ['24.20.0']

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 11.25.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy

      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa
        with:
          version: 0.13.1

      - name: pnpm install
        working-directory: experiments
        run: pnpm install --frozen-lockfile

      - name: Build hybrid engine
        working-directory: experiments
        run: pnpm build

      - name: Install Playwright browsers
        working-directory: experiments/hybrid-engine
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: experiments/hybrid-engine
        run: pnpm exec playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: experiments/hybrid-engine/playwright-report/
          retention-days: 7
