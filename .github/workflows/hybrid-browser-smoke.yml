name: hybrid-browser-smoke

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/hybrid-browser-smoke.yml'
      - 'experiments/pnpm-lock.yaml'
      - 'experiments/pnpm-workspace.yaml'
      - 'experiments/package.json'
      - 'experiments/hybrid-engine/**'
      - 'rust-toolchain.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - '.github/workflows/hybrid-browser-smoke.yml'
      - 'experiments/pnpm-lock.yaml'
      - 'experiments/pnpm-workspace.yaml'
      - 'experiments/package.json'
      - 'experiments/hybrid-engine/**'
      - 'rust-toolchain.toml'
      - 'Cargo.lock'

permissions:
  contents: read

jobs:
  smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    strategy:
      matrix:
        node-version: ['24.20.0']

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 11.25.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy

      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa
        with:
          version: v0.15.0

      - name: pnpm install
        working-directory: experiments
        run: pnpm install --frozen-lockfile

      - name: Build hybrid engine
        working-directory: experiments
        run: pnpm build

      - name: Install Chromium
        working-directory: experiments/storybook
        run: pnpm exec playwright install --with-deps chromium

      - name: Run hybrid browser smoke
        working-directory: experiments/storybook
        shell: bash
        run: |
          mkdir -p hybrid-smoke-artifacts
          (cd ../hybrid-engine && pnpm exec vite preview --host 127.0.0.1 --port 5173) > /tmp/hybrid-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/hybrid-vite.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5173/ >/dev/null

          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const targets = [
            ['main', '/'],
            ['mothership', '/mothership.html'],
            ['navigation', '/navigation.html'],
            ['routing', '/routing.html'],
            ['geothermal', '/geothermal.html'],
            ['tower-terrain', '/tower-terrain.html'],
            ['inspect', '/?inspect=1'],
          ];

          const inspectorCliUnavailable = (message) =>
            message.includes("WebSocket connection to 'ws://127.0.0.1:4400/' failed") &&
            message.includes('ERR_CONNECTION_REFUSED');

          const browser = await chromium.launch({ headless: true });
          try {
            for (const [name, path] of targets) {
              const page = await browser.newPage();
              const consoleErrors = [];
              const pageErrors = [];
              page.on('console', (message) => {
                if (message.type() !== 'error') return;
                const text = message.text();
                if (name === 'inspect' && inspectorCliUnavailable(text)) return;
                consoleErrors.push(text);
              });
              page.on('pageerror', (error) => pageErrors.push(error.message));

              const response = await page.goto(`http://127.0.0.1:5173${path}`, {
                waitUntil: 'networkidle',
                timeout: 30_000,
              });
              if (!response || response.status() >= 400) {
                throw new Error(`${name}: HTTP ${response?.status() ?? 'no response'}`);
              }

              await page.waitForSelector('[data-preview-shell]', { state: 'attached', timeout: 15_000 });
              await page.waitForSelector('.preview-header', { state: 'visible', timeout: 15_000 });
              await page.waitForFunction(
                () => document.body.dataset.previewReady === 'true',
                undefined,
                { timeout: 15_000 },
              );

              const sceneLinks = await page.locator('[data-preview-nav] a').count();
              if (sceneLinks !== 6) {
                throw new Error(`${name}: expected 6 preview scene links, found ${sceneLinks}`);
              }

              const diagnosticsHidden = await page.locator('#preview-diagnostics-panel').evaluate(
                (element) => element.hasAttribute('hidden'),
              );
              if (!diagnosticsHidden) {
                throw new Error(`${name}: diagnostics should be collapsed by default`);
              }

              if (name === 'main') {
                await page.waitForFunction(
                  () => document.querySelector('#metrics')?.textContent?.includes('bodies: 128'),
                  undefined,
                  { timeout: 15_000 },
                );

                const intro = page.locator('[data-preview-intro]');
                await intro.waitFor({ state: 'visible', timeout: 15_000 });

                const pause = page.locator('#arena-pause');
                const restart = page.locator('#arena-restart');
                const resetCamera = page.locator('#arena-camera');
                await pause.click();
                await page.waitForFunction(
                  () => document.querySelector('#metrics')?.textContent?.includes('paused: yes'),
                  undefined,
                  { timeout: 15_000 },
                );
                if ((await pause.getAttribute('aria-pressed')) !== 'true') {
                  throw new Error('main: pause control did not expose pressed state');
                }
                await pause.click();
                await resetCamera.click();

                await page.getByRole('button', { name: 'Stay in the arena' }).click();
                if (!(await intro.isHidden())) {
                  throw new Error('main: start guide did not dismiss');
                }

                await restart.click();
                await page.waitForFunction(
                  () => document.body.dataset.previewReady === 'true',
                  undefined,
                  { timeout: 15_000 },
                );
                if (await page.locator('[data-preview-intro]').count()) {
                  throw new Error('main: dismissed start guide reappeared after deterministic restart');
                }
              }

              await page.screenshot({
                path: `hybrid-smoke-artifacts/${name}.png`,
                fullPage: true,
              });

              if (pageErrors.length || consoleErrors.length) {
                throw new Error(
                  `${name}: browser errors: ${[...pageErrors, ...consoleErrors].join(' | ')}`,
                );
              }
              await page.close();
            }

            const journey = await browser.newPage();
            const journeyResponse = await journey.goto(
              'http://127.0.0.1:5173/',
              { waitUntil: 'networkidle', timeout: 30_000 },
            );
            if (!journeyResponse || journeyResponse.status() >= 400) {
              throw new Error(`journey: HTTP ${journeyResponse?.status() ?? 'no response'}`);
            }
            await journey.waitForSelector('[data-preview-intro]', { state: 'visible', timeout: 15_000 });
            await journey.getByRole('link', { name: /Towers & Terrain/ }).click();
            await journey.waitForURL(/\/tower-terrain\.html$/);
            await journey.waitForFunction(
              () => document.body.dataset.previewReady === 'true',
              undefined,
              { timeout: 15_000 },
            );
            const towerAction = journey.getByRole('button', { name: /Force T2 miss/ });
            if (!(await towerAction.count())) {
              throw new Error('journey: tower scene did not expose working interaction controls');
            }
            await towerAction.click();
            await journey.close();

            const mobile = await browser.newPage({
              viewport: { width: 390, height: 844 },
              hasTouch: true,
              isMobile: true,
            });
            const mobileErrors = [];
            mobile.on('console', (message) => {
              if (message.type() === 'error') mobileErrors.push(message.text());
            });
            mobile.on('pageerror', (error) => mobileErrors.push(error.message));

            const mobileResponse = await mobile.goto(
              'http://127.0.0.1:5173/tower-terrain.html',
              { waitUntil: 'networkidle', timeout: 30_000 },
            );
            if (!mobileResponse || mobileResponse.status() >= 400) {
              throw new Error(`mobile: HTTP ${mobileResponse?.status() ?? 'no response'}`);
            }

            await mobile.waitForSelector('[data-preview-shell]', { state: 'attached', timeout: 15_000 });
            await mobile.waitForSelector('.preview-header', { state: 'visible', timeout: 15_000 });
            await mobile.waitForFunction(
              () => document.body.dataset.previewReady === 'true',
              undefined,
              { timeout: 15_000 },
            );

            const controlsButton = mobile.getByRole('button', { name: 'Controls' });
            if ((await controlsButton.getAttribute('aria-expanded')) !== 'false') {
              throw new Error('mobile: scene controls should begin collapsed');
            }
            await controlsButton.click();
            await mobile.locator('#preview-controls-panel').waitFor({ state: 'visible' });

            const hasHorizontalOverflow = await mobile.evaluate(
              () => document.documentElement.scrollWidth > window.innerWidth + 1,
            );
            if (hasHorizontalOverflow) {
              throw new Error('mobile: preview chrome causes horizontal document overflow');
            }

            await mobile.screenshot({
              path: 'hybrid-smoke-artifacts/mobile-tower-terrain.png',
              fullPage: true,
            });

            if (mobileErrors.length) {
              throw new Error(`mobile: browser errors: ${mobileErrors.join(' | ')}`);
            }
            await mobile.close();
          } finally {
            await browser.close();
          }
          NODE

      - name: Upload smoke evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hybrid-browser-smoke-evidence
          path: |
            experiments/storybook/hybrid-smoke-artifacts/
            /tmp/hybrid-vite.log
          retention-days: 7
