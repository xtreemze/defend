name: hybrid-browser-smoke

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/hybrid-browser-smoke.yml'
      - 'experiments/pnpm-lock.yaml'
      - 'experiments/pnpm-workspace.yaml'
      - 'experiments/package.json'
      - 'experiments/hybrid-engine/**'
      - 'experiments/storybook/scripts/hybrid-browser-smoke.mjs'
      - 'rust-toolchain.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - '.github/workflows/hybrid-browser-smoke.yml'
      - 'experiments/pnpm-lock.yaml'
      - 'experiments/pnpm-workspace.yaml'
      - 'experiments/package.json'
      - 'experiments/hybrid-engine/**'
      - 'experiments/storybook/scripts/hybrid-browser-smoke.mjs'
      - 'rust-toolchain.toml'
      - 'Cargo.lock'

permissions:
  contents: read

jobs:
  smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: ['24.20.0']

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 11.25.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy

      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.15.0

      - name: pnpm install
        working-directory: experiments
        run: pnpm install --frozen-lockfile

      - name: Test hybrid Rust authority
        working-directory: experiments
        run: cargo test --manifest-path hybrid-engine/rust/Cargo.toml

      - name: Test hybrid planners
        working-directory: experiments
        run: pnpm --filter @defend/hybrid-engine-lab test

      - name: Check hybrid source
        working-directory: experiments
        run: pnpm --filter @defend/hybrid-engine-lab check

      - name: Build modern experiments
        working-directory: experiments
        run: pnpm build

      - name: Install Playwright Chromium
        working-directory: experiments/storybook
        run: pnpm exec playwright install --with-deps chromium

      - name: Run hybrid browser smoke
        working-directory: experiments
        shell: bash
        run: |
          pnpm --filter @defend/hybrid-engine-lab exec vite preview --host 127.0.0.1 --port 5173 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5173/ >/dev/null
          pnpm --filter @defend/storybook-lab exec node scripts/hybrid-browser-smoke.mjs

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hybrid-smoke-artifacts
          path: experiments/storybook/hybrid-smoke-artifacts/
          retention-days: 7
