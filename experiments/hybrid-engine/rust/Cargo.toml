[package]
name = "defend-hybrid-runtime"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy_app = { version = "0.19.1", default-features = false, features = ["std"] }
bevy_ecs = { version = "0.19.1", default-features = false, features = ["std"] }
bevy_math = { version = "0.19.1", default-features = false, features = ["std"] }
wasm-bindgen = "0.2.127"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"

# Keep wasm-opt's validation feature set explicit. rustc emits bulk-memory and
# non-trapping float-to-int operations for wasm32-unknown-unknown; passing these
# features explicitly prevents optimizer-default drift from rejecting valid
# compiler output.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '--enable-bulk-memory', '--enable-nontrapping-float-to-int']
